name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset_label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset_label: macOS-arm64
            arch: arm64
            platform: macos
          # macos-13 (Intel) runners are often unavailable / long-queued and
          # would block the whole release matrix; ship arm64 + Windows for now.
          - os: windows-latest
            asset_label: Windows-x64
            arch: x64
            platform: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(python -c "import re; t=open('main.py').read(); m=re.search(r'APP_VERSION\\s*=\\s*[\"\\']([^\"\\']+)', t); print(m.group(1) if m else '0.0.0')")"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VER}"

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos'
        run: |
          python -m pip install -U pip
          # c104 has no macOS wheels; install patched sdist, then the rest
          grep -v '^c104' requirements.txt > /tmp/reqs-noc104.txt
          python -m pip install -r /tmp/reqs-noc104.txt pyinstaller pyinstaller-hooks-contrib pillow
          chmod +x tools/install_c104_macos.sh
          bash tools/install_c104_macos.sh "$(command -v python)"

      - name: Build macOS .app
        if: matrix.platform == 'macos'
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: bash build_macos.sh

      - name: Sign and notarize macOS .app
        if: matrix.platform == 'macos'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          chmod +x tools/sign_and_notarize_macos.sh
          bash tools/sign_and_notarize_macos.sh

      - name: Package macOS zip
        if: matrix.platform == 'macos'
        run: |
          ZIP_NAME="Ranaliz-iOT-Tester-${{ steps.version.outputs.version }}-${{ matrix.asset_label }}.zip"
          ditto -c -k --keepParent "dist/Ranaliz iOT Tester.app" "${ZIP_NAME}"
          echo "ASSET_PATH=${ZIP_NAME}" >> "$GITHUB_ENV"
          ls -lh "${ZIP_NAME}"

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          # build_windows.bat uses project .venv
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -U pip
          .venv/Scripts/python.exe -m pip install -r requirements.txt pyinstaller pyinstaller-hooks-contrib pillow

      - name: Build Windows .exe
        if: matrix.platform == 'windows'
        shell: cmd
        run: build_windows.bat

      - name: Sign Windows .exe (SignPath)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          Install-Module -Name SignPath -RequiredVersion 4.4.1 -Force -Scope CurrentUser
          New-Item -ItemType Directory -Force -Path signed | Out-Null
          Submit-SigningRequest `
            -InputArtifactPath "dist/Ranaliz iOT Tester.exe" `
            -OrganizationId "09284a1c-2f5f-4697-8388-5280c4e5b66c" `
            -ProjectSlug "ranaliz-iot-tester" `
            -SigningPolicySlug "test-release" `
            -ApiToken $env:SIGNPATH_API_TOKEN `
            -WaitForCompletion `
            -OutputArtifactPath "signed/Ranaliz iOT Tester.exe"

      - name: Package Windows artifact
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          EXE_NAME="Ranaliz-iOT-Tester-${{ steps.version.outputs.version }}-${{ matrix.asset_label }}.exe"
          cp "signed/Ranaliz iOT Tester.exe" "${EXE_NAME}"
          echo "ASSET_PATH=${EXE_NAME}" >> "$GITHUB_ENV"
          ls -lh "${EXE_NAME}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_label }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    # Publish whatever platforms succeeded (do not block on a single matrix failure)
    if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: List release files
        run: |
          ls -lh artifacts/
          test -n "$(ls -A artifacts 2>/dev/null)" || (echo "No build artifacts to publish" >&2; exit 1)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
